<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Web com Sidebar</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Ícones do Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- CSS Customizado -->
  <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container-fluid">
        <div class="row min-vh-100">
        
        <!-- SIDEBAR DE NAVEGAÇÃO -->
        <aside class="col-md-3 col-lg-2 bg-dark text-white p-3 sidebar">
            <div class="d-flex align-items-center mb-4 text-white text-decoration-none fs-4 fw-bold">
            <i class="bi bi-box-seam me-2 text-primary"></i> MeuApp
            </div>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto" id="sidebar-menu">
            <li class="nav-item mb-1">
                <a href="#/dashboard" class="nav-link text-white active" data-route="dashboard">
                <i class="bi bi-speedometer2 me-2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item mb-1">
                <a href="#/novo" class="nav-link text-white" data-route="novo">
                <i class="bi bi-plus-circle me-2"></i> Novo Item
                </a>
            </li>
            <li class="nav-item mb-1">
                <a href="#/listar" class="nav-link text-white" data-route="listar">
                <i class="bi bi-list-task me-2"></i> Listar Itens
                </a>
            </li>
            </ul>
        </aside>

        <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4 bg-light">
            <div id="content-area">
            <!-- O conteúdo dinâmico das views será injetado aqui -->
            </div>
        </main>

        </div>
    </div>

    <!-- JS do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Módulo Principal JavaScript -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
